name: desktop_spirit
description: 桌面灵宠 —— 从一颗蛋破壳的狐耳少女桌面宠物。可拖拽、能扒在屏幕边缘只露一个脑袋、两套皮肤 14 个表情、自动溜达、完全离线（安卓版）。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  flutter_overlay_window:
    path: packages/flutter_overlay_window
  flutter_tts: ^3.8.5
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/angry/
    - assets/dance/
    - assets/eat/
    - assets/egg/
    - assets/evolve/
    - assets/final/
    - assets/happy/
    - assets/hungry/
    - assets/idle/
    - assets/items/
    - assets/roll/
    - assets/sfx/
    - assets/sleep/
    - assets/talk/